[package]
name = "sl-rust"
version.workspace = true
edition.workspace = true
autobins = false
description = "SL - An ASCII art train animation"
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["terminal", "animation", "train", "sl", "wasi"]
categories = ["command-line-utilities"]

[lib]
name = "sl"
path = "src/lib.rs"

[dependencies]
wasibox-core = { workspace = true, default-features = false }

[target.'cfg(not(target_os = "wasi"))'.dependencies]
crossterm = "0.29"

[[bin]]
name = "sl"
path = "src/main.rs"

[features]
default = []
debug = []

[dev-dependencies]
lazy_static = "1.5.0"
