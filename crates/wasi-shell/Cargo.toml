[package]
name = "wasi-shell"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "A modular WASI-compatible shell with piping and redirection"
license.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
wasibox-core = { workspace = true, default-features = true }
sl-rust = { workspace = true, optional = true }
shlex = { workspace = true }
colored = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[features]
default = ["sl", "coreutils"]
sl = ["dep:sl-rust"]
# coreutils includes most wasibox-core utilities as built-ins
coreutils = ["arch", "cat", "cp", "dir", "echo", "grep", "head", "ls", "mkdir", "mv", "pwd", "rm", "rmdir", "seq", "sleep", "tail", "tee", "touch", "tree", "uname", "wc", "whoami", "yes", "basename", "dirname", "true", "false", "env", "clear", "link", "ln", "unlink"]

arch = []
cat = []
cp = []
dir = []
echo = []
grep = []
head = []
ls = []
mkdir = []
mv = []
pwd = []
rm = []
rmdir = []
seq = []
sleep = []
tail = []
tee = []
touch = []
tree = []
uname = []
wc = []
whoami = []
yes = []
basename = []
dirname = []
true = []
false = []
env = []
clear = []
link = []
ln = []
unlink = []

[dev-dependencies]
tempfile = { workspace = true }
